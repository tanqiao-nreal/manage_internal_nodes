- name: Launch Everything on every managed host, if it isn't already running
  hosts: managed
  gather_facts: false
  vars:
    everything_exe: 'C:\Program Files\Everything\Everything.exe'
  tasks:
    - name: Check whether Everything is running outside the background service
      # EVERYTHING_SERVICE=1 always keeps a headless `Everything.exe -svc`
      # running, but that one doesn't serve the HTTP API - only the normal
      # (non -svc) instance, launched via START_ON_STARTUP or by hand, does.
      # So process-name alone isn't enough; filter by command line instead.
      ansible.windows.win_shell: |
        $running = Get-CimInstance Win32_Process -Filter "Name = 'Everything.exe'" |
          Where-Object { $_.CommandLine -notmatch '-svc' }
        if ($running) { exit 0 } else { exit 1 }
      register: everything_gui_running
      changed_when: false
      failed_when: false

    - name: Remove any pre-existing launch task before recreating it
      # Stale state from a previous run would otherwise make the create
      # step below a no-op (nothing to change), which doesn't matter now
      # that launching is a separate explicit step below, but keeps the
      # task definition itself always freshly matching this run.
      when: everything_gui_running.rc != 0
      community.windows.win_scheduled_task:
        name: EverythingLaunch
        state: absent

    - name: Register a Scheduled Task to launch Everything
      # A process started directly over SSH lands in Session 0 (invisible)
      # and is killed once the SSH connection closes (Win32-OpenSSH job
      # object cleanup) - confirmed by testing. Starting it as a Scheduled
      # Task instead sidesteps both: Task Scheduler is independent of the
      # SSH job, and defaulting username/logon_type runs it under the
      # current interactive token, in whichever session the target user is
      # logged into.
      when: everything_gui_running.rc != 0
      community.windows.win_scheduled_task:
        name: EverythingLaunch
        description: Task used to launch Everything outside the deploying SSH session's job/session scope.
        actions:
          - path: "{{ everything_exe }}"
            arguments: -startup
        state: present
        enabled: true

    - name: Start the launch task
      # No trigger is defined above - a `registration` trigger (fires once,
      # immediately, on creation) looked like the natural fit, but it
      # turned out to be unreliable in practice: confirmed on a real host
      # where the task was created successfully yet Task Scheduler's own
      # history showed it had never actually run. Explicitly starting the
      # task is deterministic and was confirmed working on that same host.
      when: everything_gui_running.rc != 0
      ansible.windows.win_shell: Start-ScheduledTask -TaskName EverythingLaunch
      failed_when: false
