- name: Read the current machine name from every compute node
  hosts: computes
  gather_facts: false
  tasks:
    - name: Run hostname on the host
      ansible.windows.win_shell: hostname
      register: hostname_result
      changed_when: false
      failed_when: false

- name: Write the collected names to a CSV report
  hosts: localhost
  gather_facts: false
  vars:
    report_timestamp: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
    report_path: "{{ playbook_dir }}/../../output/compute_name/{{ report_timestamp }}.csv"
  tasks:
    - name: Ensure the output directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../output/compute_name"
        state: directory

    - name: Render the CSV report
      ansible.builtin.template:
        src: report.csv.j2
        dest: "{{ report_path }}"

    - name: Report where the CSV landed
      ansible.builtin.debug:
        msg: "Wrote {{ report_path }}"
